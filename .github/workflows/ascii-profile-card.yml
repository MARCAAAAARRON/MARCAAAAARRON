name: ASCII profile card

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  card:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: hu553in/ascii-profile-card@v1
        with:
          config: |
            card:
              lines:
                - { type: header, text: 'Marc Arron C. Nepomuceno' }
                - { type: kv, key: Role, value: 'Computer Science student & developer' }
                - { type: kv, key: Focus, value: 'Full-stack, local AI tooling' }
                - { type: section, title: 'GitHub stats' }
                - { type: kv, key: Stars, value: '{stars}' }
