    .title { fill: #f8fafc; font-size: 16px; font-weight: 700; letter-spacing: 1.5px; }
    .sub { fill: #64748b; font-size: 12px; }
    .twinkle { animation: tw 3s ease-in-out infinite; }
    .b { animation-delay: 1s; } .c { animation-delay: 2s; }
    @keyframes tw { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
  </style>
