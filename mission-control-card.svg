<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-label="Mission Control card for Marc Arron" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151b3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <clipPath id="card"><rect width="800" height="300" rx="14"/></clipPath>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace; }
    .k { fill: #64748b; font-size: 15px; }
    .v { fill: #e2e8f0; font-size: 15px; }
    .title { fill: #f8fafc; font-size: 16px; font-weight: 700; letter-spacing: 1.5px; }
    .motto { fill: url(#accent); font-size: 15px; font-weight: 700; }
    .live { fill: #4ade80; font-size: 15px; font-weight: 700; }
    .pulse { animation: pulse 1.8s ease-in-out infinite; transform-origin: 318px 218px; }
    .twinkle { animation: tw 3s ease-in-out infinite; }
    .twinkle.b { animation-delay: 1s; }
    .twinkle.c { animation-delay: 2s; }
    .orbit { animation: spin 14s linear infinite; transform-origin: 700px 160px; }
    .cursor { animation: blink 1s steps(2) infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: .35; transform: scale(1.6);} }
    @keyframes tw { 0%,100% { opacity: .2;} 50% { opacity: 1;} }
    @keyframes spin { to { transform: rotate(360deg);} }
    @keyframes blink { 0%,100% { opacity: 1;} 50% { opacity: 0;} }
  </style>

  <g clip-path="url(#card)">
    <rect width="800" height="300" fill="url(#bg)"/>

    <!-- stars -->
    <g fill="#e2e8f0">
      <circle class="twinkle" cx="560" cy="70" r="1.5"/>
      <circle class="twinkle b" cx="620" cy="250" r="1.2"/>
      <circle class="twinkle c" cx="760" cy="60" r="1.5"/>
      <circle class="twinkle" cx="520" cy="200" r="1"/>
      <circle class="twinkle b" cx="740" cy="270" r="1.3"/>
      <circle class="twinkle c" cx="650" cy="40" r="1"/>
    </g>

    <!-- orbit graphic -->
    <g>
      <circle cx="700" cy="160" r="58" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 5"/>
      <circle cx="700" cy="160" r="34" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2 6"/>
      <circle cx="700" cy="160" r="14" fill="url(#accent)"/>
      <g class="orbit">
        <circle cx="758" cy="160" r="5" fill="#38bdf8"/>
      </g>
    </g>

    <!-- window header -->
    <rect width="800" height="46" fill="#0f172a"/>
    <line x1="0" y1="46" x2="800" y2="46" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="26" cy="23" r="6" fill="#f87171"/>
    <circle cx="48" cy="23" r="6" fill="#fbbf24"/>
    <circle cx="70" cy="23" r="6" fill="#4ade80"/>
    <text x="100" y="29" class="title">MISSION CONTROL  ::  MARC ARRON</text>

    <!-- rows -->
    <text x="40" y="98"  class="k">callsign</text>
    <text x="150" y="98" class="k">:</text>
    <text x="170" y="98" class="v">MARCAAAAARRON</text>

    <text x="40" y="136"  class="k">role</text>
    <text x="150" y="136" class="k">:</text>
    <text x="170" y="136" class="v">Full-Stack Engineer · ML &amp; AI Engineer</text>

    <text x="40" y="174"  class="k">home base</text>
    <text x="150" y="174" class="k">:</text>
    <text x="170" y="174" class="v">Philippines</text>

    <text x="40" y="212"  class="k">status</text>
    <text x="150" y="212" class="k">:</text>
    <circle class="pulse" cx="318" cy="218" r="0" fill="#4ade80"/>
    <circle cx="178" cy="207" r="5" fill="#4ade80"/>
    <circle class="pulse" cx="178" cy="207" r="5" fill="#4ade80" style="transform-origin:178px 207px"/>
    <text x="194" y="212" class="live">IN ORBIT</text>
    <text x="278" y="212" class="k">(day-by-day, never skipping)</text>

    <text x="40" y="250"  class="k">motto</text>
    <text x="150" y="250" class="k">:</text>
    <text x="170" y="250" class="motto">Always learning. Always building.</text>
    <rect class="cursor" x="496" y="236" width="9" height="17" fill="#38bdf8"/>

    <!-- border -->
    <rect x="1" y="1" width="798" height="298" rx="14" fill="none" stroke="#334155" stroke-width="2"/>
  </g>
</svg>
